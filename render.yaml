# Render Blueprint: one free web service that runs the Docker image in this repository.
services:
  - type: web
    name: lite-events
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "4000"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_KEY
        sync: false
