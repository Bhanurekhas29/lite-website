# One container serves the website, the PHP API and the uploaded images.
ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html

    # Behind the hosting service's HTTPS proxy: tell PHP the visit is secure
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Any address that is not a real file is a page of the React app
        FallbackResource /index.html
    </Directory>

    # The API: its single entry file is the only backend file with a web address
    AliasMatch "^/api(/.*)?$" "/var/www/backend/index.php"
    <Directory /var/www/backend>
        Options -Indexes
        Require all granted
    </Directory>

    # Uploaded images (never run as code)
    Alias /media/ /var/www/backend/media/
    <Directory /var/www/backend/media>
        Options -Indexes
        Require all granted
        <FilesMatch "\.(php|phtml|phar|php[0-9])$">
            Require all denied
        </FilesMatch>
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
